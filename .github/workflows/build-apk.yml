name: Build Sri Rejeki Jeans APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -q SriRejekiJeans_Android_Source_V3.zip -d source

      - name: Find Android project
        run: |
          echo "Mencari project Android..."
          find source -name settings.gradle -o -name settings.gradle.kts
      - name: Enable AndroidX
        run: |
          PROJECT=$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)")
          cp gradle.properties "$PROJECT/gradle.properties"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fix Kotlin dependency conflict
        run: |
          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)")
          echo "Project: $PROJECT"
          cd "$PROJECT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --init-script "$GITHUB_WORKSPACE/kotlin-fix.gradle" assembleDebug
          else
            gradle --init-script "$GITHUB_WORKSPACE/kotlin-fix.gradle" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SriRejekiJeans-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
